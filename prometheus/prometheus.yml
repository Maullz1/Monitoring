global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - "/etc/prometheus/rules/alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "mktxp"
    static_configs:
      - targets: ["mktxp:49090"]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "(python_.*|process_.*)"
        action: drop

  - job_name: "smokeping"
    scrape_interval: 15s
    static_configs:
      - targets: ["smokeping:9374"]

  - job_name: "cadvisor"
    scrape_interval: 15s
    static_configs:
      - targets: ["cadvisor:8080"]
