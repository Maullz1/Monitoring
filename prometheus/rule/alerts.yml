# CATATAN: threshold latency (0.15 = 150ms) masih perlu divalidasi ulang
# untuk Gancit (Velo/Fibernet) - baseline sebelumnya cuma dites di ITC.
# Cek histogram_quantile(0.90, ...) per "name" setelah smokeping jalan 1-2 hari.
groups:
  - name: exporter-health
    rules:
      - alert: MktxpExporterDown
        expr: up{job="mktxp"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Proses mktxp berhenti total"
          description: "Prometheus gagal scrape mktxp sama sekali selama >2 menit. SEMUA router (ITC & GNC) kehilangan monitoring."

      - alert: SmokepingExporterDown
        expr: up{job="smokeping"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Proses smokeping berhenti total"
          description: "Prometheus gagal scrape smokeping selama >2 menit. Monitoring ping SEMUA ISP (ITC & GNC) terputus."

  - name: per-router-health
    rules:
      - alert: RouterDataMissing
        expr: absent_over_time(mktxp_system_uptime{routerboard_name="ITC"}[5m])
        for: 2m
        labels:
          severity: critical
          router: "ITC"
        annotations:
          summary: "Router ITC berhenti kirim data"
          description: "mktxp masih hidup, tapi data dari router ITC spesifik hilang >5 menit. Kemungkinan API ITC unreachable meski router GNC masih normal."

      - alert: RouterDataMissing
        expr: absent_over_time(mktxp_system_uptime{routerboard_name="GNC"}[5m])
        for: 2m
        labels:
          severity: critical
          router: "GNC"
        annotations:
          summary: "Router GNC berhenti kirim data"
          description: "mktxp masih hidup, tapi data dari router GNC spesifik hilang >5 menit. Kemungkinan API GNC unreachable meski router ITC masih normal."

  - name: isp-health
    rules:
      - alert: ISPHighPacketLoss
        expr: (rate(smokeping_requests_total[5m]) - rate(smokeping_response_duration_seconds_count[5m])) / rate(smokeping_requests_total[5m]) > 0.1
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Packet loss tinggi di {{ $labels.name }}"
          description: "Packet loss ke {{ $labels.name }} ({{ $labels.ip }}) lebih dari 10% selama 3 menit."

      - alert: ISPHighLatency
        expr: histogram_quantile(0.90, rate(smokeping_response_duration_seconds_bucket[5m])) > 0.15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Latency tinggi di {{ $labels.name }}"
          description: "P90 latency ke {{ $labels.name }} ({{ $labels.ip }}) di atas 150ms selama 5 menit."

  - name: container-health
    rules:
      - alert: ContainerDown
        expr: (time() - container_last_seen{name=~"itc-.*"}) > 60
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Container {{ $labels.name }} berhenti"
          description: "Container {{ $labels.name }} tidak terdeteksi aktif oleh cAdvisor selama lebih dari 1 menit."
